name: Kene Auto PR

on:
  push:
    branches:
      - kene

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:kene`,
              base: 'main',
              state: 'open'
            });
            if (prs.length === 0) {
              const pr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🤖 Kene: ${context.payload.commits?.[0]?.message || context.sha.substring(0, 7)}`,
                head: 'kene',
                base: 'main',
                body: '> Auto-generated PR from Kene OpenClaw assistant.\n\nReview and merge when ready.'
              });
              console.log('PR created:', pr.data.html_url);
            } else {
              console.log('PR already open:', prs[0].html_url);
            }
